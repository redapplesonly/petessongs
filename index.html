
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cosmic Cruiser Demo Songs</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #d9efff;
      color: #17365d;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 750px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0, 40, 80, 0.12);
    }

    header {
      background-color: #b5dcf5;
      text-align: center;
      padding: 25px 15px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0 0 12px 0;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
    }

    .song {
      padding: 20px 0;
      border-bottom: 1px solid #c5dced;
    }

    .song h2 {
      font-size: 22px;
      margin: 0 0 8px 0;
    }

    .song p {
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 15px 0;
    }

    audio {
      display: block;
      width: 100%;
      max-width: 600px;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: #526b84;
      margin-top: 35px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- WEBSITE BANNER -->

    <header>
      <h1>"Cosmic Cruiser" Demo Songs</h1>
      <p>
        Demo songs<br>
        Click Play to listen.
      </p>
    </header>


    <!-- SONG 1 -->
    <!-- Duplicate this section for each additional song -->

    <section class="song">

      <h2>"Cosmic Cruiser"</h2>

      <p>
        Page 1  --  Sung by TEEN CHORUS
      </p>

      <audio controls preload="none">
        <source src="Cosmic Cruiser.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>

    </section>


    <!-- ADD SONGS 2 THROUGH 7 HERE -->


    <!-- COPYRIGHT NOTICE -->

    <footer>
      &copy; 2026 Peter Hummon. All rights reserved.<br>
      These recordings and original musical works
      are protected by copyright.
    </footer>

  </main>

</body>
</html>
